<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"><title>The GTA V Port app versus the game files</title><rect width="1200" height="532" rx="28" fill="#F5F5F7"/><rect x="32" y="32" width="500" height="360" rx="20" fill="#fff"/><circle cx="88" cy="92" r="30" fill="#D91C2B"/><g transform="translate(73.0 77.0) scale(1.25)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" />
