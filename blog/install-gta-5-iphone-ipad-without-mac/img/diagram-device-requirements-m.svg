  <path d="M5 12.859a10 10 0 0 1 14 0" />
  <path d="M8.5 16.429a5 5 0 0 1 7 0" /></g><text x="114" y="532.0" font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="start">Wi-Fi</text><text x="114" y="560.0" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">Required for setup, pairing and</text><text x="114" y="581.6" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">refreshing</text><rect x="24" y="604" width="412" height="104" rx="20" fill="#fff"/><circle cx="72" cy="656" r="26" fill="#1D1D1F"/><g transform="translate(59.0 643.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5" />
  <path d="M20 21a8 8 0 0 0-16 0" /></g><text x="114" y="648.0" font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="start">Free Apple Account</text><text x="114" y="676.0" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">Apps are signed for 7 days at a</text><text x="114" y="697.6" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">time</text></svg>