<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 732" width="460" height="732" role="img" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"><title>Device requirements for GTA V Port on iPhone and iPad</title><rect width="460" height="732" rx="28" fill="#F5F5F7"/><rect x="24" y="24" width="412" height="104" rx="20" fill="#fff"/><circle cx="72" cy="76" r="26" fill="#1D1D1F"/><g transform="translate(59.0 63.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
  <path d="M12 18h.01" /></g><text x="114" y="68.0" font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="start">iOS / iPadOS 16+</text><text x="114" y="96.0" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">Minimum to run GTA V Port</text><rect x="24" y="140" width="412" height="104" rx="20" fill="#fff"/><circle cx="72" cy="192" r="26" fill="#1D1D1F"/><g transform="translate(59.0 179.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2" />
  <line x1="12" x2="12.01" y1="18" y2="18" /></g><text x="114" y="184.0" font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="start">iOS / iPadOS 27+</text><text x="114" y="212.0" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">Needed for the no-computer</text><text x="114" y="233.6" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">SideInstaller route</text><rect x="24" y="256" width="412" height="104" rx="20" fill="#fff"/><circle cx="72" cy="308" r="26" fill="#1D1D1F"/><g transform="translate(59.0 295.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12v-2" />
  <path d="M12 18v-2" />
  <path d="M16 12v-2" />
  <path d="M16 18v-2" />
  <path d="M2 11h1.5" />
  <path d="M20 18v-2" />
  <path d="M20.5 11H22" />
  <path d="M4 18v-2" />
  <path d="M8 12v-2" />
  <path d="M8 18v-2" />
  <rect x="2" y="6" width="20" height="10" rx="2" /></g><text x="114" y="300.0" font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="start">6 GB RAM ideal</text><text x="114" y="328.0" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">Extra-memory entitlement helps; 4</text><text x="114" y="349.6" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">GB devices struggle</text><rect x="24" y="372" width="412" height="104" rx="20" fill="#fff"/><circle cx="72" cy="424" r="26" fill="#1D1D1F"/><g transform="translate(59.0 411.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01" />
  <path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
  <path d="M21.946 12.013H2.054" />
  <path d="M6 16h.01" /></g><text x="114" y="416.0" font-size="21" font-weight="700" fill="#1D1D1F" text-anchor="start">~30 GB free</text><text x="114" y="444.0" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">149 MB app plus roughly 20 GB of</text><text x="114" y="465.6" font-size="16" font-weight="400" fill="#6E6E73" text-anchor="start">game data</text><rect x="24" y="488" width="412" height="104" rx="20" fill="#fff"/><circle cx="72" cy="540" r="26" fill="#1D1D1F"/><g transform="translate(59.0 527.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" />
