  <path d="m16 9-5.5 5.5L8 12" /></g><text x="90" y="224.0" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start">Engine and launcher only, no</text><text x="90" y="248.3" font-size="18" font-weight="400" fill="#3A3A3C" text-anchor="start">game content</text><g transform="translate(56 267.6) scale(0.9166666666666666)" fill="none" stroke="#D91C2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
