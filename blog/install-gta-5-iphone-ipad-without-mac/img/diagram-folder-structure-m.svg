  <path d="m2 2 20 20" /></g><text x="140" y="419.8" font-size="22" font-weight="700" fill="#6E6E73" text-anchor="start">iCloud Drive</text><line x1="140" y1="412.79999999999995" x2="279" y2="412.79999999999995" stroke="#D91C2B" stroke-width="2"/><text x="140" y="449.8" font-size="17" font-weight="400" fill="#D91C2B" text-anchor="start">Don't keep game data here</text><text x="140" y="472.7" font-size="17" font-weight="400" fill="#D91C2B" text-anchor="start">— store it locally</text><rect x="32" y="554.6999999999999" width="396" height="104" rx="18" fill="#fff"/><g transform="translate(56 584.6999999999999) scale(1.0833333333333333)" fill="none" stroke="#1F9D55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="m16 9-5.5 5.5L8 12" /></g><text x="96" y="588.7" font-size="18" font-weight="500" fill="#3A3A3C" text-anchor="start">On relaunch the app checks the</text><text x="96" y="613.0" font-size="18" font-weight="500" fill="#3A3A3C" text-anchor="start">files and can unpack an archive</text><text x="96" y="637.3" font-size="18" font-weight="500" fill="#3A3A3C" text-anchor="start">for you.</text></svg>