<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 682.6999999999999" width="460" height="682.6999999999999" role="img" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"><title>Where the game files go in the Files app</title><rect width="460" height="682.6999999999999" rx="28" fill="#F5F5F7"/><rect x="32" y="32" width="396" height="502.69999999999993" rx="20" fill="#fff"/><g transform="translate(56 72) scale(1.3333333333333333)" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2" />
