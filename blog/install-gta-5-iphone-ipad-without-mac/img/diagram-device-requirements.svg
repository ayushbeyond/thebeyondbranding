<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 544" width="1200" height="544" role="img" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"><title>Device requirements for GTA V Port on iPhone and iPad</title><rect width="1200" height="544" rx="28" fill="#F5F5F7"/><rect x="32" y="32" width="368" height="230" rx="20" fill="#fff"/><circle cx="82" cy="86" r="26" fill="#1D1D1F"/><g transform="translate(69.0 73.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
  <path d="M12 18h.01" /></g><text x="60" y="152.0" font-size="26" font-weight="700" fill="#1D1D1F" text-anchor="start">iOS / iPadOS 16+</text><text x="60" y="191.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">Minimum to run GTA V Port</text><rect x="420" y="32" width="368" height="230" rx="20" fill="#fff"/><circle cx="470" cy="86" r="26" fill="#1D1D1F"/><g transform="translate(457.0 73.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2" />
  <line x1="12" x2="12.01" y1="18" y2="18" /></g><text x="448" y="152.0" font-size="26" font-weight="700" fill="#1D1D1F" text-anchor="start">iOS / iPadOS 27+</text><text x="448" y="191.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">Needed for the no-computer</text><text x="448" y="218.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">SideInstaller route</text><rect x="808" y="32" width="368" height="230" rx="20" fill="#fff"/><circle cx="858" cy="86" r="26" fill="#1D1D1F"/><g transform="translate(845.0 73.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12v-2" />
  <path d="M12 18v-2" />
  <path d="M16 12v-2" />
  <path d="M16 18v-2" />
  <path d="M2 11h1.5" />
  <path d="M20 18v-2" />
  <path d="M20.5 11H22" />
  <path d="M4 18v-2" />
  <path d="M8 12v-2" />
  <path d="M8 18v-2" />
  <rect x="2" y="6" width="20" height="10" rx="2" /></g><text x="836" y="152.0" font-size="26" font-weight="700" fill="#1D1D1F" text-anchor="start">6 GB RAM ideal</text><text x="836" y="191.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">Extra-memory entitlement</text><text x="836" y="218.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">helps; 4 GB devices struggle</text><rect x="32" y="282" width="368" height="230" rx="20" fill="#fff"/><circle cx="82" cy="336" r="26" fill="#1D1D1F"/><g transform="translate(69.0 323.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01" />
  <path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
  <path d="M21.946 12.013H2.054" />
  <path d="M6 16h.01" /></g><text x="60" y="402.0" font-size="26" font-weight="700" fill="#1D1D1F" text-anchor="start">~30 GB free</text><text x="60" y="441.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">149 MB app plus roughly 20 GB</text><text x="60" y="468.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">of game data</text><rect x="420" y="282" width="368" height="230" rx="20" fill="#fff"/><circle cx="470" cy="336" r="26" fill="#1D1D1F"/><g transform="translate(457.0 323.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01" />
  <path d="M2 8.82a15 15 0 0 1 20 0" />
  <path d="M5 12.859a10 10 0 0 1 14 0" />
  <path d="M8.5 16.429a5 5 0 0 1 7 0" /></g><text x="448" y="402.0" font-size="26" font-weight="700" fill="#1D1D1F" text-anchor="start">Wi-Fi</text><text x="448" y="441.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">Required for setup, pairing</text><text x="448" y="468.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">and refreshing</text><rect x="808" y="282" width="368" height="230" rx="20" fill="#fff"/><circle cx="858" cy="336" r="26" fill="#1D1D1F"/><g transform="translate(845.0 323.0) scale(1.0833333333333333)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5" />
  <path d="M20 21a8 8 0 0 0-16 0" /></g><text x="836" y="402.0" font-size="26" font-weight="700" fill="#1D1D1F" text-anchor="start">Free Apple Account</text><text x="836" y="441.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">Apps are signed for 7 days at</text><text x="836" y="468.1" font-size="20" font-weight="400" fill="#6E6E73" text-anchor="start">a time</text></svg>