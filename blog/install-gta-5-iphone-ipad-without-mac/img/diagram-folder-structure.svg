<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 526" width="1200" height="526" role="img" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"><title>Where the game files go in the Files app</title><rect width="1200" height="526" rx="28" fill="#F5F5F7"/><rect x="32" y="32" width="1136" height="386" rx="20" fill="#fff"/><g transform="translate(56 72) scale(1.3333333333333333)" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2" />
  <line x1="12" x2="12.01" y1="18" y2="18" /></g><text x="104" y="86.0" font-size="22" font-weight="700" fill="#1D1D1F" text-anchor="start">On My iPad / iPhone</text><text x="104" y="116.0" font-size="17" font-weight="400" fill="#6E6E73" text-anchor="start">Files app → Browse</text><path d="M72 122 V174 H104" fill="none" stroke="#E3E3E8" stroke-width="2"/><g transform="translate(112 156) scale(1.3333333333333333)" fill="none" stroke="#0A66D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></g><text x="160" y="170.0" font-size="22" font-weight="700" fill="#1D1D1F" text-anchor="start">GTA V Port</text><text x="160" y="200.0" font-size="17" font-weight="400" fill="#6E6E73" text-anchor="start">Created the first time you open the app</text><path d="M128 206 V258 H160" fill="none" stroke="#E3E3E8" stroke-width="2"/><g transform="translate(168 240) scale(1.3333333333333333)" fill="none" stroke="#0A66D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></g><text x="216" y="254.0" font-size="22" font-weight="700" fill="#1D1D1F" text-anchor="start">your game data</text><text x="216" y="284.0" font-size="17" font-weight="400" fill="#6E6E73" text-anchor="start">Folder or archive, about 20 GB</text><path d="M72 290 V342 H104" fill="none" stroke="#E3E3E8" stroke-width="2"/><g transform="translate(112 324) scale(1.3333333333333333)" fill="none" stroke="#D91C2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.94 5.274A7 7 0 0 1 15.71 10h1.79a4.5 4.5 0 0 1 4.222 6.057" />
  <path d="M18.796 18.81A4.5 4.5 0 0 1 17.5 19H9A7 7 0 0 1 5.79 5.78" />
  <path d="m2 2 20 20" /></g><text x="160" y="338.0" font-size="22" font-weight="700" fill="#6E6E73" text-anchor="start">iCloud Drive</text><line x1="160" y1="331" x2="299" y2="331" stroke="#D91C2B" stroke-width="2"/><text x="160" y="368.0" font-size="17" font-weight="400" fill="#D91C2B" text-anchor="start">Don't keep game data here — store it locally</text><rect x="32" y="438" width="1136" height="64" rx="18" fill="#fff"/><g transform="translate(56 457) scale(1.0833333333333333)" fill="none" stroke="#1F9D55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="m16 9-5.5 5.5L8 12" /></g><text x="96" y="478.0" font-size="18" font-weight="500" fill="#3A3A3C" text-anchor="start">On relaunch the app checks the files and can unpack an archive for you.</text></svg>